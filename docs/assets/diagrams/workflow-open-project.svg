<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" width="720" height="500" fill="none">
  <defs>
    <marker id="arrow-em" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#A1A1AA"/>
    </marker>
  </defs>

  <!-- ====== Lane headers (5 lanes, evenly spaced) ====== -->
  <!-- Lane x-centers: 70, 210, 350, 490, 640 -->
  <g>
    <rect x="20" y="20" width="100" height="36" rx="6" stroke="#A1A1AA" stroke-width="1.5"/>
    <text x="70" y="42" text-anchor="middle" font-family="Satoshi, system-ui"
      font-size="12" font-weight="600" fill="#F4F4F5">User</text>

    <rect x="155" y="20" width="110" height="36" rx="6" stroke="#10B981" stroke-width="1.5"/>
    <text x="210" y="38" text-anchor="middle" font-family="Satoshi, system-ui"
      font-size="12" font-weight="600" fill="#F4F4F5">DropZone</text>
    <text x="210" y="50" text-anchor="middle" font-family="JetBrains Mono, monospace"
      font-size="9" fill="#71717A">React</text>

    <rect x="295" y="20" width="110" height="36" rx="6" stroke="#10B981" stroke-width="1.5"/>
    <text x="350" y="38" text-anchor="middle" font-family="Satoshi, system-ui"
      font-size="12" font-weight="600" fill="#F4F4F5">Tauri Command</text>
    <text x="350" y="50" text-anchor="middle" font-family="JetBrains Mono, monospace"
      font-size="9" fill="#71717A">Rust IPC</text>

    <rect x="435" y="20" width="110" height="36" rx="6" stroke="#10B981" stroke-width="1.5"/>
    <text x="490" y="38" text-anchor="middle" font-family="Satoshi, system-ui"
      font-size="12" font-weight="600" fill="#F4F4F5">UnityHandler</text>
    <text x="490" y="50" text-anchor="middle" font-family="JetBrains Mono, monospace"
      font-size="9" fill="#71717A">FormatHandler</text>

    <rect x="585" y="20" width="110" height="36" rx="6" stroke="#A1A1AA" stroke-width="1.5"/>
    <text x="640" y="38" text-anchor="middle" font-family="Satoshi, system-ui"
      font-size="12" font-weight="600" fill="#F4F4F5">AssetRipper</text>
    <text x="640" y="50" text-anchor="middle" font-family="JetBrains Mono, monospace"
      font-size="9" fill="#71717A">.exe sidecar</text>
  </g>

  <!-- ====== Lifelines (dashed verticals from 56 to 484) ====== -->
  <g stroke="#3F3F46" stroke-width="1" stroke-dasharray="4 4">
    <line x1="70"  y1="56" x2="70"  y2="484"/>
    <line x1="210" y1="56" x2="210" y2="484"/>
    <line x1="350" y1="56" x2="350" y2="484"/>
    <line x1="490" y1="56" x2="490" y2="484"/>
    <line x1="640" y1="56" x2="640" y2="484"/>
  </g>

  <!-- ====== Sequence messages ====== -->
  <!-- 1. User → DropZone: drop folder (y=80) -->
  <line x1="72" y1="80" x2="208" y2="80" stroke="#10B981" stroke-width="1.5"
    marker-end="url(#arrow-em)"/>
  <text x="140" y="74" text-anchor="middle" font-family="Satoshi, system-ui"
    font-size="12" fill="#F4F4F5">drop folder</text>

  <!-- 2. DropZone → Tauri Command (y=108) -->
  <line x1="212" y1="108" x2="348" y2="108" stroke="#10B981" stroke-width="1.5"
    marker-end="url(#arrow-em)"/>
  <text x="280" y="102" text-anchor="middle" font-family="JetBrains Mono, monospace"
    font-size="11" fill="#F4F4F5">invoke('detect_project', path)</text>

  <!-- 3. Tauri Command → UnityHandler (y=136) -->
  <line x1="352" y1="136" x2="488" y2="136" stroke="#10B981" stroke-width="1.5"
    marker-end="url(#arrow-em)"/>
  <text x="420" y="130" text-anchor="middle" font-family="JetBrains Mono, monospace"
    font-size="11" fill="#F4F4F5">detect(path)</text>

  <!-- 4. UnityHandler → Tauri Command (return, y=168) -->
  <line x1="488" y1="168" x2="352" y2="168" stroke="#A1A1AA" stroke-width="1.5"
    stroke-dasharray="5 3" marker-end="url(#arrow-gray)"/>
  <text x="420" y="162" text-anchor="middle" font-family="JetBrains Mono, monospace"
    font-size="11" fill="#A1A1AA">DetectionResult</text>
  <text x="420" y="182" text-anchor="middle" font-family="JetBrains Mono, monospace"
    font-size="10" fill="#71717A">confidence: 0.95 · backend: Mono</text>

  <!-- 5. Tauri Command → DropZone (return, y=210) -->
  <line x1="348" y1="210" x2="212" y2="210" stroke="#A1A1AA" stroke-width="1.5"
    stroke-dasharray="5 3" marker-end="url(#arrow-gray)"/>
  <text x="280" y="204" text-anchor="middle" font-family="JetBrains Mono, monospace"
    font-size="11" fill="#A1A1AA">Auto</text>

  <!-- 6. DropZone → Tauri Command: invoke open_project (y=238) -->
  <line x1="212" y1="238" x2="348" y2="238" stroke="#10B981" stroke-width="1.5"
    marker-end="url(#arrow-em)"/>
  <text x="280" y="232" text-anchor="middle" font-family="JetBrains Mono, monospace"
    font-size="11" fill="#F4F4F5">invoke('open_project', path)</text>

  <!-- 7. Tauri Command → UnityHandler: open (y=266) -->
  <line x1="352" y1="266" x2="488" y2="266" stroke="#10B981" stroke-width="1.5"
    marker-end="url(#arrow-em)"/>
  <text x="420" y="260" text-anchor="middle" font-family="JetBrains Mono, monospace"
    font-size="11" fill="#F4F4F5">open(path, ctx)</text>

  <!-- 8. UnityHandler → AssetRipper: extract (y=294) -->
  <line x1="492" y1="294" x2="638" y2="294" stroke="#10B981" stroke-width="1.5"
    marker-end="url(#arrow-em)"/>
  <text x="565" y="288" text-anchor="middle" font-family="JetBrains Mono, monospace"
    font-size="11" fill="#F4F4F5">extract(in, out)</text>

  <!-- 9. AssetRipper → UnityHandler: progress (y=322) -->
  <line x1="638" y1="322" x2="492" y2="322" stroke="#A1A1AA" stroke-width="1.5"
    stroke-dasharray="5 3" marker-end="url(#arrow-gray)"/>
  <text x="565" y="316" text-anchor="middle" font-family="JetBrains Mono, monospace"
    font-size="11" fill="#A1A1AA">progress 0% → 100%</text>

  <!-- 10. UnityHandler self-loop: store cache (y=348) -->
  <path d="M 490 348 H 530 V 366 H 490" stroke="#10B981" stroke-width="1.5" fill="none"
    marker-end="url(#arrow-em)"/>
  <text x="540" y="354" font-family="JetBrains Mono, monospace" font-size="10"
    fill="#A1A1AA">store AssetTree → SQLite cache</text>

  <!-- 11. UnityHandler → Tauri Command: ProjectHandle (y=388) -->
  <line x1="488" y1="388" x2="352" y2="388" stroke="#A1A1AA" stroke-width="1.5"
    stroke-dasharray="5 3" marker-end="url(#arrow-gray)"/>
  <text x="420" y="382" text-anchor="middle" font-family="JetBrains Mono, monospace"
    font-size="11" fill="#A1A1AA">ProjectHandle</text>
  <text x="420" y="402" text-anchor="middle" font-family="JetBrains Mono, monospace"
    font-size="10" fill="#71717A">id · extractedDir · backend</text>

  <!-- 12. Tauri Command → DropZone (y=430) -->
  <line x1="348" y1="430" x2="212" y2="430" stroke="#A1A1AA" stroke-width="1.5"
    stroke-dasharray="5 3" marker-end="url(#arrow-gray)"/>
  <text x="280" y="424" text-anchor="middle" font-family="JetBrains Mono, monospace"
    font-size="11" fill="#A1A1AA">handle</text>

  <!-- 13. DropZone → User: navigate (y=462) -->
  <line x1="208" y1="462" x2="72" y2="462" stroke="#10B981" stroke-width="1.5"
    marker-end="url(#arrow-em)"/>
  <text x="140" y="456" text-anchor="middle" font-family="JetBrains Mono, monospace"
    font-size="11" fill="#F4F4F5">navigate → /project/$id</text>
</svg>
