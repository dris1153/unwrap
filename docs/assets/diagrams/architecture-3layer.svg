<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" fill="none">
  <defs>
    <marker id="arrow-em" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#A1A1AA"/>
    </marker>
  </defs>

  <!-- ============ LAYER 1: PRESENTATION ============ -->
  <g>
    <!-- Tinted background -->
    <rect x="40" y="20" width="640" height="100" rx="8"
      fill="rgba(16,185,129,0.10)" stroke="#10B981" stroke-width="1.5"/>
    <!-- Label badge -->
    <text x="56" y="42" font-family="JetBrains Mono, monospace" font-size="10"
      fill="#10B981" letter-spacing="1.6">PRESENTATION  ·  React + TypeScript</text>
    <!-- Sub-boxes -->
    <rect x="64" y="56" width="180" height="48" rx="6" stroke="#A1A1AA" stroke-width="1.5"/>
    <text x="154" y="78" text-anchor="middle" font-family="Satoshi, system-ui"
      font-size="13" fill="#F4F4F5">FileTree Sidebar</text>
    <text x="154" y="94" text-anchor="middle" font-family="JetBrains Mono, monospace"
      font-size="10" fill="#71717A">tree · search · recents</text>

    <rect x="264" y="56" width="200" height="48" rx="6" stroke="#A1A1AA" stroke-width="1.5"/>
    <text x="364" y="78" text-anchor="middle" font-family="Satoshi, system-ui"
      font-size="13" fill="#F4F4F5">Editor / Tabs / Preview</text>
    <text x="364" y="94" text-anchor="middle" font-family="JetBrains Mono, monospace"
      font-size="10" fill="#71717A">Monaco · image · 3D viewer</text>

    <rect x="484" y="56" width="172" height="48" rx="6" stroke="#A1A1AA" stroke-width="1.5"/>
    <text x="570" y="78" text-anchor="middle" font-family="Satoshi, system-ui"
      font-size="13" fill="#F4F4F5">Inspector</text>
    <text x="570" y="94" text-anchor="middle" font-family="JetBrains Mono, monospace"
      font-size="10" fill="#71717A">props · refs · metadata</text>
  </g>

  <!-- Connector + annotation between L1 and L2 -->
  <line x1="360" y1="120" x2="360" y2="142" stroke="#10B981" stroke-width="1.5"
    marker-end="url(#arrow-em)"/>
  <text x="370" y="135" font-family="JetBrains Mono, monospace" font-size="10"
    font-style="italic" fill="#A1A1AA">Tauri IPC (JSON)</text>

  <!-- ============ LAYER 2: APPLICATION ============ -->
  <g>
    <rect x="40" y="148" width="640" height="184" rx="8"
      stroke="#10B981" stroke-width="1.5"/>
    <text x="56" y="170" font-family="JetBrains Mono, monospace" font-size="10"
      fill="#10B981" letter-spacing="1.6">APPLICATION  ·  Rust + Tauri</text>

    <!-- Tauri Commands -->
    <rect x="64" y="184" width="240" height="28" rx="6" stroke="#A1A1AA" stroke-width="1.5"/>
    <text x="184" y="202" text-anchor="middle" font-family="Satoshi, system-ui"
      font-size="13" fill="#F4F4F5">Tauri Commands</text>

    <!-- Format Detection Service -->
    <rect x="64" y="220" width="240" height="28" rx="6" stroke="#A1A1AA" stroke-width="1.5"/>
    <text x="184" y="238" text-anchor="middle" font-family="Satoshi, system-ui"
      font-size="13" fill="#F4F4F5">Format Detection Service</text>

    <!-- FormatHandler Registry -->
    <rect x="64" y="256" width="240" height="64" rx="6" stroke="#10B981" stroke-width="1.5"/>
    <text x="184" y="274" text-anchor="middle" font-family="Satoshi, system-ui"
      font-size="12" font-weight="600" fill="#F4F4F5">FormatHandler Registry</text>
    <!-- 3 sub items -->
    <rect x="76" y="284" width="68" height="24" rx="4"
      fill="rgba(16,185,129,0.10)" stroke="#10B981" stroke-width="1.5"/>
    <text x="110" y="300" text-anchor="middle" font-family="JetBrains Mono, monospace"
      font-size="10" fill="#10B981">Unity</text>

    <rect x="148" y="284" width="72" height="24" rx="4"
      stroke="#71717A" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="184" y="300" text-anchor="middle" font-family="JetBrains Mono, monospace"
      font-size="10" fill="#71717A">Unreal</text>

    <rect x="224" y="284" width="68" height="24" rx="4"
      stroke="#71717A" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="258" y="300" text-anchor="middle" font-family="JetBrains Mono, monospace"
      font-size="10" fill="#71717A">PE/ELF</text>

    <!-- Sidecar Process Manager -->
    <rect x="324" y="184" width="332" height="28" rx="6" stroke="#A1A1AA" stroke-width="1.5"/>
    <text x="490" y="202" text-anchor="middle" font-family="Satoshi, system-ui"
      font-size="13" fill="#F4F4F5">Sidecar Process Manager</text>
    <text x="490" y="220" text-anchor="middle" font-family="JetBrains Mono, monospace"
      font-size="10" font-style="italic" fill="#71717A">spawn · IPC · cancel · timeout</text>

    <!-- Project Cache -->
    <rect x="324" y="240" width="332" height="80" rx="6" stroke="#A1A1AA" stroke-width="1.5"/>
    <text x="490" y="266" text-anchor="middle" font-family="Satoshi, system-ui"
      font-size="13" fill="#F4F4F5">Project Cache</text>
    <text x="490" y="284" text-anchor="middle" font-family="JetBrains Mono, monospace"
      font-size="10" fill="#71717A">SQLite</text>
    <text x="490" y="304" text-anchor="middle" font-family="JetBrains Mono, monospace"
      font-size="10" fill="#71717A">recents · tree snapshots · notes</text>
  </g>

  <!-- Connector L2 → L3 -->
  <line x1="360" y1="332" x2="360" y2="354" stroke="#10B981" stroke-width="1.5"
    marker-end="url(#arrow-em)"/>
  <text x="370" y="347" font-family="JetBrains Mono, monospace" font-size="10"
    font-style="italic" fill="#A1A1AA">subprocess (stdin/stdout JSON)</text>

  <!-- ============ LAYER 3: EXTERNAL TOOLS ============ -->
  <g>
    <rect x="40" y="360" width="640" height="56" rx="8"
      fill="rgba(16,185,129,0.10)" stroke="#10B981" stroke-width="1.5"/>
    <text x="56" y="378" font-family="JetBrains Mono, monospace" font-size="10"
      fill="#10B981" letter-spacing="1.6">EXTERNAL TOOLS  ·  sidecars</text>

    <!-- AssetRipper -->
    <rect x="64" y="386" width="192" height="22" rx="4" stroke="#A1A1AA" stroke-width="1.5"/>
    <text x="76" y="401" font-family="Satoshi, system-ui" font-size="12" fill="#F4F4F5">AssetRipper</text>
    <text x="160" y="401" font-family="JetBrains Mono, monospace" font-size="10"
      font-style="italic" fill="#71717A">GPL · subprocess</text>

    <!-- ILSpyCmd -->
    <rect x="264" y="386" width="160" height="22" rx="4" stroke="#A1A1AA" stroke-width="1.5"/>
    <text x="276" y="401" font-family="Satoshi, system-ui" font-size="12" fill="#F4F4F5">ILSpyCmd</text>
    <text x="368" y="401" font-family="JetBrains Mono, monospace" font-size="10"
      font-style="italic" fill="#71717A">MIT</text>

    <!-- Il2CppDumper -->
    <rect x="432" y="386" width="224" height="22" rx="4" stroke="#A1A1AA" stroke-width="1.5"/>
    <text x="444" y="401" font-family="Satoshi, system-ui" font-size="12" fill="#F4F4F5">Il2CppDumper</text>
    <text x="548" y="401" font-family="JetBrains Mono, monospace" font-size="10"
      font-style="italic" fill="#71717A">MIT · IL2CPP only</text>
  </g>
</svg>
